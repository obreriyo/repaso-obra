name: Generar APK

on:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      - run: npm install --no-save @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
      - run: npx cap init "Repaso de obra" com.obreriyo.repasoobra --web-dir=dist
      - run: npx cap add android
      - name: Permiso de cámara (para el botón Cámara)
        run: |
          F=android/app/src/main/AndroidManifest.xml
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />\n</manifest>#' "$F"
          grep -n "CAMERA" "$F"
      - run: npx cap sync android
      - name: Clave de firma fija (para poder actualizar encima sin desinstalar)
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -e
          mkdir -p "$HOME/.android"
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -q -c "create table if not exists public.secretos (clave text primary key, valor text not null, created_at timestamptz not null default now())"
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -q -c "alter table public.secretos enable row level security"
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -q -c "revoke all on public.secretos from anon, authenticated"
          B64=$(psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -At -c "select valor from public.secretos where clave = 'android_debug_keystore'")
          if [ -z "$B64" ]; then
            echo "No hay clave guardada: se crea una nueva (solo ocurre la primera vez)."
            keytool -genkeypair -keystore /tmp/nueva.keystore -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 36500 -dname "CN=Repaso obra,O=Repaso obra,C=ES"
            NUEVA=$(base64 -w0 /tmp/nueva.keystore)
            psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -q -c "insert into public.secretos (clave, valor) values ('android_debug_keystore', '$NUEVA') on conflict (clave) do nothing"
            B64=$(psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -At -c "select valor from public.secretos where clave = 'android_debug_keystore'")
          fi
          echo "$B64" | base64 -d > "$HOME/.android/debug.keystore"
          keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android | grep -i "fingerprint\|huella" || true
      - run: ./gradlew assembleDebug
        working-directory: android
      - name: Poner nombre al archivo
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Repaso-obra.apk
      - uses: actions/upload-artifact@v4
        with:
          name: repaso-obra-apk
          path: Repaso-obra.apk
