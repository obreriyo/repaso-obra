name: Aplicar actualización

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Descomprimir y copiar
        run: |
          if [ -f repaso-obra-v2.zip ]; then
            unzip -q -o repaso-obra-v2.zip -d /tmp/v2
            rm -rf /tmp/v2/repaso-obra/.github
            cp -r /tmp/v2/repaso-obra/. .
            rm -f repaso-obra-v2.zip
          else
            echo "No hay zip nuevo: se aplican solo los cambios ya guardados."
          fi

      - name: Guardar cambios
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -m "Actualización" || echo "Sin cambios que guardar"
          git push

      - name: Base de datos (migraciones)
        env:
          DB: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$DB" ]; then
            echo "::warning::Falta el secreto SUPABASE_DB_URL: no se ha tocado la base de datos."
            exit 0
          fi
          psql "$DB" -v ON_ERROR_STOP=1 -q -c "create table if not exists public.migraciones_aplicadas (nombre text primary key, aplicada timestamptz not null default now()); alter table public.migraciones_aplicadas enable row level security;"
          for f in supabase/migraciones/*.sql; do
            n=$(basename "$f")
            ya=$(psql "$DB" -tAc "select 1 from public.migraciones_aplicadas where nombre = '$n'")
            if [ -z "$ya" ]; then
              echo "Aplicando $n"
              psql "$DB" -v ON_ERROR_STOP=1 -q -1 -f "$f"
              psql "$DB" -v ON_ERROR_STOP=1 -q -c "insert into public.migraciones_aplicadas (nombre) values ('$n')"
            else
              echo "$n ya estaba aplicada"
            fi
          done

      - name: Publicar la web
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml
