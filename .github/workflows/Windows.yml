name: Generar Windows

on:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      - name: Preparar el programa
        shell: bash
        run: |
          set -e
          mkdir -p escritorio/build
          cp -r dist escritorio/dist
          cp public/icon-512.png escritorio/build/icon.png
      - name: Crear el .exe
        working-directory: escritorio
        run: |
          npm install
          npx electron-builder --win portable --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: repaso-obra-windows
          path: escritorio/release/Repaso-obra.exe
